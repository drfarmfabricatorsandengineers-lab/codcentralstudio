<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#001854"/>
  <!-- Red accent block top-right -->
  <rect x="38" y="6" width="20" height="8" rx="3" fill="#FF272A"/>
  <!-- C shape using two rectangles + cutout illusion -->
  <!-- Top bar of C -->
  <rect x="10" y="14" width="30" height="8" rx="3" fill="#ffffff"/>
  <!-- Left stem of C -->
  <rect x="10" y="14" width="8" height="36" rx="3" fill="#ffffff"/>
  <!-- Bottom bar of C -->
  <rect x="10" y="42" width="30" height="8" rx="3" fill="#ffffff"/>
  <!-- Red dot accent -->
  <circle cx="48" cy="32" r="6" fill="#FF272A"/>
</svg>
